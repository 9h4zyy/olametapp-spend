r Status Submissions through the Service, Email, and mobile phone and to display parts of User Status Submissions as permitted through the functionality of the Service and under these Terms of Service. The foregoing license granted by you terminates once you remove or delete a User Status Submission from the Olamet Service."
        - paragraph [ref=f16e42]: "3. In connection with User Status Submissions, you further agree that you will not: (1) submit material that is copyrighted, protected by trade secret or otherwise subject to third party proprietary rights, including privacy and publicity rights, unless you are the owner of such rights or have permission from their rightful owner to post the material and to grant Olamet all of the license rights granted herein; (2) publish falsehoods or misrepresentations that could damage Olamet Live or any third party; (3) submit material that is unlawful, obscene, defamatory, libelous, threatening, harassing, hateful, racially or ethnically offensive, or encourages conduct that would be considered a criminal offense, give rise to civil liability, violate any law, or is otherwise inappropriate; (4) post advertisements or solicitations of business; (5) impersonate another person; (6) send or store material containing software viruses, worms, Trojan horses or other harmful computer code, files, scripts, agents or programs; (7) interfere with or disrupt the integrity or performance of the Service or the data contained therein; or (8) attempt to gain unauthorized access to the Service or its related systems or networks."
