      - generic [ref=e121]:
        - article [ref=e122]:
          - button "Is this an official Olamet agency?" [ref=e123] [cursor=pointer]
          - paragraph [ref=e127]: Yes, we have been partners for years with Olamet as an official Olamet agency. We have helped hosts and agents around the world to start their live streaming partner on Olamet and earn on their own.
        - article [ref=e128]:
          - button "How does an Olamet host or agent work?" [ref=e129] [cursor=pointer]
          - paragraph [ref=e133]: As an Olamet host, you simply have to live stream and chat with the viewers. For an agent, you’re working as a manager for the hosts, and get an income from the hosts’ earnings as an agency commission.
        - article [ref=e134]:
          - button "How can I withdraw my money on Olamet?" [ref=e135] [cursor=pointer]
          - paragraph [ref=e139]: Olamet supports various withdrawal methods, from bank transfer, digital wallet/e-wallet, to cryptocurrency. Any agents can withdraw their live streaming income any time, however the process may take up to 1-3 business days.
        - article [ref=e140]:
          - button "Is there a basic/base salary?" [ref=e141] [cursor=pointer]
          - paragraph [ref=e145]: No. To earn a salary or some sort of stable income, it depends on your team. If your team earns a stable income, automatically you will earn one as well.
        - article [ref=e146]:
          - button "Is my privacy or data safe as a host or agent?" [ref=e147] [cursor=pointer]
          - paragraph [ref=e151]: Yes, Olamet only requires your phone number or email during registration. Olamet also has strict rules regarding privacy and personal information breach.
        - article [ref=e152]:
          - button "What if I have problems with the official Olamet app?" [ref=e153] [cursor=pointer]
          - paragraph [ref=e157]: As an official agency partner, if you have problems regarding your account, withdrawal, or others on the platform, we are obligated to help you solve it with the official Olamet admin.
