        - generic [ref=f1e166]: Payout Rules
        - heading "Olamet Agency & Host Withdrawal Information" [level=2] [ref=f1e167]
      - generic [ref=f1e168]:
        - article [ref=f1e169]:
          - heading "Withdrawal Information" [level=3] [ref=f1e170]
          - list [ref=f1e171]:
            - listitem [ref=f1e172]: The withdrawal amount must be $10 or more; any unused gold beans will be accumulated and can be cashed out later.
            - listitem [ref=f1e173]: The withdrawal amount must be a multiple of $10, and any remaining balance will be accumulated and cashed out in the next settlement cycle.
            - listitem [ref=f1e174]: The settlement cycle runs from Monday to Sunday. The settlement time is 10:00 AM (UTC+7) every Monday.
            - listitem [ref=f1e175]: We will pay your salary to your withdrawal account every Monday.
        - article [ref=f1e176]:
          - heading "Sub-agency Commission" [level=3] [ref=f1e177]
          - generic [ref=f1e178]: "Commission Formula: Your agency daily commission = (Your daily ratio - sub-agent’s daily ratio) × Your sub-agent’s daily revenue"
          - list [ref=f1e179]:
            - listitem [ref=f1e180]: If you have multiple sub-agents, separate calculation is needed for each individual sub-agents
            - listitem [ref=f1e181]: Your daily commission revenue is determined by your total earnings for the last 30 days
          - img "Olamet Sub-agency Daily Commission Calculation Formula" [ref=f1e183]
      - article [ref=f1e184]:
        - heading "How to Withdraw on Olamet" [level=3] [ref=f1e185]
        - list [ref=f1e186]:
          - listitem [ref=f1e187]: "Go to Your Profile: Launch the app and tap your profile icon."
          - listitem [ref=f1e188]: "Open 'My Income': Select the My Income menu to view your current bean balance."
          - listitem [ref=f1e189]: "Click 'Withdraw': Tap the withdrawal button to start your cash out."
          - listitem [ref=f1e190]: "Click the Top Right Arrow: Find the banner at the top of the screen and tap the arrow in the top right corner to access your payout settings."
          - listitem [ref=f1e191]: "Fill Out Your Info: Enter your personal withdrawal information. Make sure it matches your bank or e-wallet details exactly!"
          - listitem [ref=f1e192]: "Choose a Payment Method: Select how you want to receive your money (bank transfer or e-wallet)."
          - listitem [ref=f1e193]:
            - text: "Enter the Amount: Type in how much you want to withdraw and submit."
            - paragraph [ref=f1e194]: "a. Note: The minimum payout is $10 USD."
            - paragraph [ref=f1e195]: "b. Note: The withdrawal ratio is 10,000 beans = $1 USD (100,000 beans = $10)."
        - img "Step-by-step How to Withdraw Beans on Olamet App" [ref=f1e197]
    - generic [ref=f1e199]:
      - generic [ref=f1e200]:
        - generic [ref=f1e201]: Got Questions?
        - heading "Frequently Asked Questions" [level=2] [ref=f1e202]
      - generic [ref=f1e203]:
        - article [ref=f1e204]:
          - 'button "FAQ 1: What is Olamet Agency?" [ref=f1e205] [cursor=pointer]'
          - paragraph [ref=f1e209]: Olamet Agency is an official partner who can manage hosts, grow your agency, and earn commissions from your team’s activity. We provide support, guidance and benefits to help your agency grow.
        - article [ref=f1e210]:
          - 'button "FAQ 2: How can I register as an Olamet Agency?" [ref=f1e211] [cursor=pointer]'
          - generic:
            - paragraph [ref=f1e215]: To register, open the official agency registration link and complete your information using an active phone number. After submitting your number, click “Send” to receive the OTP code. Once registered, download the Olamet app from the Play Store and log in using the same registered phone number.
            - paragraph [ref=f1e216]: If the registration page shows “We invite you to be the host of Olamet”, do not worry. As long as you accessed the page through the official registration link, you are following the correct process.
        - article [ref=f1e217]:
          - 'button "FAQ 3: What are the types of Olamet Agency?" [ref=f1e218] [cursor=pointer]'
          - generic:
            - paragraph [ref=f1e222]: "Olamet provides two agency options with the same commission rate but different advantages:"
            - paragraph [ref=f1e223]: ● Video Room Agency focuses on hosts using video call and call features. This agency provides free call opportunities and better exposure in the live video section.
            - paragraph [ref=f1e224]: ● Party Room Agency focuses on hosts using the party room feature. This agency provides extra rewards from party room gifts and an additional 30% regular gift share.
        - article [ref=f1e225]:
          - 'button "FAQ 4: How much commission can an Olamet Agency earn?" [ref=f1e226] [cursor=pointer]'
          - paragraph [ref=f1e230]: Olamet Agency commission depends on the total weekly Beans revenue generated by your hosts and sub-agents. The commission rate increases based on weekly performance, starting from 5% for revenue below 500K Beans and reaching up to 36% for 500M Beans revenue.
        - article [ref=f1e231]:
          - 'button "FAQ 5: How is the weekly commission calculated?" [ref=f1e232] [cursor=pointer]'
          - paragraph [ref=f1e236]: Your weekly revenue is calculated from the combined earnings of your hosts and your sub-agents during that week. The agency commission rate is updated weekly according to the total Beans revenue achieved. Reaching higher revenue levels allows your agency to receive a higher commission percentage.
