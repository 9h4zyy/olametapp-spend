        - paragraph [ref=e253]: Please adhere to platform standards to maintain a safe, professional agency ecosystem
      - list [ref=e255]:
        - listitem [ref=e256]: Agents are not allowed to spam "join agency" invitations to hosts and users.
        - listitem [ref=e257]: Agents are not allowed to recruit hosts from other agents on the platform.
        - listitem [ref=e258]: It is prohibited to promote other Apps.
        - listitem [ref=e259]: Hala Live strictly prohibits any fraudulent activities. Any violations will result in permanent account suspension.
        - listitem [ref=e260]: If the agent does not process the request to leave the agency within 7 days, the host will automatically leave the agency.
        - listitem [ref=e261]: Hosts who have been with the agency for less than 24 hours can leave the agency immediately after submitting their first request.
        - listitem [ref=e262]: After submitting a request to leave, regardless of whether the request is approved, the hosts cannot submit another request within 30 days.
