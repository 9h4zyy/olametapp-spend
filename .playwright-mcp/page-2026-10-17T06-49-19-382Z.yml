        - heading "Hala Live Agency Rules" [level=2] [ref=f2e218]
        - paragraph [ref=f2e219]: Please adhere to platform standards to maintain a safe, professional agency ecosystem
      - list [ref=f2e221]:
        - listitem [ref=f2e222]: Agents are not allowed to spam "join agency" invitations to hosts and users.
        - listitem [ref=f2e223]: Agents are not allowed to recruit hosts from other agents on the platform.
        - listitem [ref=f2e224]: It is prohibited to promote other Apps.
        - listitem [ref=f2e225]: Hala Live strictly prohibits any fraudulent activities. Any violations will result in permanent account suspension.
        - listitem [ref=f2e226]: If the agent does not process the request to leave the agency within 7 days, the host will automatically leave the agency.
        - listitem [ref=f2e227]: Hosts who have been with the agency for less than 24 hours can leave the agency immediately after submitting their first request.
        - listitem [ref=f2e228]: After submitting a request to leave, regardless of whether the request is approved, the hosts cannot submit another request within 30 days.
