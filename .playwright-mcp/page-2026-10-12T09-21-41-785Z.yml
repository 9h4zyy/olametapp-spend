    - generic [ref=e173]:
      - generic [ref=e174]:
        - generic [ref=e175]: Got Questions?
        - heading "Frequently Asked Questions" [level=2] [ref=e176]
      - generic [ref=e177]:
        - article [ref=e178]:
          - button "1. How can I register as an Olamet Live Host?" [ref=e179] [cursor=pointer]
          - paragraph [ref=e183]: To register as an Olamet Live Host, download the Olamet app from the Google Play Store. Then, create an account using your Google account or phone number.
        - article [ref=e184]:
          - button "2. Do I need to verify my phone number when registering?" [ref=e185] [cursor=pointer]
          - paragraph [ref=e189]: Yes. If you register using your phone number, Olamet will send an OTP verification code to your device.
        - article [ref=e190]:
          - button "3. How do Olamet Host Daily Task Rewards work?" [ref=e191] [cursor=pointer]
          - generic:
            - paragraph [ref=e195]: Olamet provides daily rewards for top-performing hosts who complete specific performance targets. The reward level is based on your previous week’s income, including requirements such as gift income, live hours, and total calls.
            - paragraph [ref=e196]: Hosts must complete all required tasks for their assigned level to receive the Beans reward. Before joining the reward program, hosts must apply and receive approval first.
        - article [ref=e197]:
          - button "4. How much can I earn from Daily Task Rewards?" [ref=e198] [cursor=pointer]
          - generic:
            - paragraph [ref=e202]: The reward depends on your achievement level. Hosts can receive rewards starting from 5,000 Beans at Level 1 and up to 100,000 Beans at Level 7 by completing the required gift income, live hours, and call targets.
            - paragraph [ref=e203]: Higher performance levels provide higher Beans rewards.
        - article [ref=e204]:
          - button "5. What are the rules for Olamet Live Hosts?" [ref=e205] [cursor=pointer]
          - paragraph [ref=e209]: Olamet hosts must follow platform rules to maintain a safe and professional community. Hosts are required to use only one account, avoid prohibited explicit content during public live broadcasts, and must not transfer accounts or encourage hosts to leave their agency system. All hosts must also be 18 years old or older to work on Olamet.
